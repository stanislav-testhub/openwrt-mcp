name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: sh -n install.sh && sh -n install-router.sh && sh -n files/etc/init.d/openwrt-mcp

      - name: router-side installer downloads and verifies
        run: bash install-router_test.sh

      # One architecture table in three places: what install.sh builds for, what the router-side
      # installer downloads, and what the release workflow publishes.
      - name: architecture tables agree
        run: |
          set -eu
          pats() { sed -n "/^$2()/,/^}/p" "$1" | grep -oE '^[[:space:]]+[a-z0-9_*|-]+\)' | tr -d ' \t'; }
          [ "$(pats install.sh go_target)" = "$(pats install-router.sh arch_label)" ] ||
            { echo "go_target (install.sh) and arch_label (install-router.sh) match different DISTRIB_ARCH patterns"; exit 1; }
          for l in $(sed -n '/^arch_label()/,/^}/p' install-router.sh | grep -oE 'echo [a-z0-9_]+' | cut -d' ' -f2); do
            grep -qE "^ +$l +" .github/workflows/release.yml || { echo "release.yml does not build '$l'"; exit 1; }
          done

      # Every architecture install.sh can target must at least compile.
      - name: cross-build
        run: |
          set -eu
          for t in "arm64" "arm 7" "arm 5" "mipsle softfloat" "mips softfloat" "mips64le" "mips64" "amd64" "386" "riscv64"; do
            set -- $t
            case "$1" in arm) export GOARM=$2 ;; mips|mipsle) export GOMIPS=$2 ;; esac
            CGO_ENABLED=0 GOOS=linux GOARCH=$1 go build -trimpath -ldflags="-s -w" -o /dev/null .
            unset GOARM GOMIPS
          done

      # `openwrt-mcp connect` runs on the operator's PC, so the binary must build and vet there too.
      - name: PC builds
        run: |
          set -eu
          for t in "windows amd64" "windows arm64" "darwin amd64" "darwin arm64"; do
            set -- $t
            GOOS=$1 GOARCH=$2 go vet .
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w" -o /dev/null .
          done

      - name: payload files are LF and parse
        run: |
          set -eu
          ! grep -rlI $'\r' files install.sh install-router.sh install-router_test.sh
          python3 -m json.tool files/usr/share/luci/menu.d/luci-app-openwrt-mcp.json >/dev/null
          python3 -m json.tool files/usr/share/rpcd/acl.d/luci-app-openwrt-mcp.json >/dev/null
          # keep.d must name everything install.sh puts outside /etc/config.
          for f in /usr/bin/openwrt-mcp /etc/init.d/openwrt-mcp /etc/openwrt-mcp \
                   /usr/share/luci/menu.d/luci-app-openwrt-mcp.json \
                   /usr/share/rpcd/acl.d/luci-app-openwrt-mcp.json \
                   /www/luci-static/resources/view/openwrt-mcp/status.js; do
            grep -qx "$f" files/lib/upgrade/keep.d/openwrt-mcp || { echo "keep.d misses $f"; exit 1; }
          done

  # The fakes in the unit tests cannot say whether apk or opkg accept the command lines the tools
  # build, or whether their output still has the shape the parsers expect. These tests run the
  # package and uci tools inside the OpenWrt rootfs of each supported release. There is no ubus
  # or netifd in a container, so network, wireless and firewall paths are not covered here.
  real-target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: x86-64-24.10.8, pkg: opkg }
          - { tag: x86-64-25.12.5, pkg: apk }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build the real-target tests
        run: CGO_ENABLED=0 go test -c -tags realtarget -o realtarget.test .
      # /var/lock is made by the init scripts, which a container does not run; opkg needs it.
      - name: run them in the ${{ matrix.tag }} rootfs
        run: |
          docker run --rm -v "$PWD:/w" -e REALTARGET_PKG=${{ matrix.pkg }} openwrt/rootfs:${{ matrix.tag }} \
            sh -c 'mkdir -p /var/lock /var/run /var/state && exec /w/realtarget.test -test.v -test.timeout 10m'
